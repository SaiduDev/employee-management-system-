<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departments - Employee Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout" id="appLayout"></div>

  <!-- Add/Edit Department Modal -->
  <div class="modal-overlay" id="departmentModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="departmentModalTitle">Add Department</h3>
        <button class="modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="departmentForm">
        <div class="modal-body">
          <input type="hidden" id="departmentId">
          <div class="form-group">
            <label for="deptName">Department Name *</label>
            <input type="text" id="deptName" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="deptDescription">Description</label>
            <textarea id="deptDescription" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveDepartmentBtn">Save Department</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteDepartmentModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3>Confirm Delete</h3>
        <button class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete <strong id="deleteDepartmentName"></strong>? This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteDeptBtn">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/departments.js"></script>
</body>
</html>
