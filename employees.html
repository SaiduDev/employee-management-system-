<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees - Employee Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout" id="appLayout"></div>

  <!-- Add/Edit Employee Modal -->
  <div class="modal-overlay" id="employeeModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="employeeModalTitle">Add Employee</h3>
        <button class="modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="employeeForm">
        <div class="modal-body">
          <input type="hidden" id="employeeId">
          <div class="form-row">
            <div class="form-group">
              <label for="empFullName">Full Name *</label>
              <input type="text" id="empFullName" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="empEmail">Email *</label>
              <input type="email" id="empEmail" class="form-control" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="empPhone">Phone</label>
              <input type="tel" id="empPhone" class="form-control">
            </div>
            <div class="form-group">
              <label for="empDepartment">Department *</label>
              <select id="empDepartment" class="form-control" required>
                <option value="">Select Department</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="empPosition">Position *</label>
              <input type="text" id="empPosition" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="empStatus">Employment Status *</label>
              <select id="empStatus" class="form-control" required>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="on_leave">On Leave</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveEmployeeBtn">Save Employee</button>
        </div>
      </form>
    </div>
  </div>

  <!-- View Employee Modal -->
  <div class="modal-overlay" id="viewEmployeeModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Employee Details</h3>
        <button class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="employeeDetails"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteEmployeeModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3>Confirm Delete</h3>
        <button class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete <strong id="deleteEmployeeName"></strong>? This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/employees.js"></script>
</body>
</html>
