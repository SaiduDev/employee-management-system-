<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Management - Employee Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout" id="appLayout"></div>

  <!-- Apply Leave Modal -->
  <div class="modal-overlay" id="applyLeaveModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Apply for Leave</h3>
        <button class="modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="applyLeaveForm">
        <div class="modal-body">
          <div class="form-group">
            <label for="leaveType">Leave Type *</label>
            <select id="leaveType" class="form-control" required>
              <option value="">Select Leave Type</option>
              <option value="annual">Annual Leave</option>
              <option value="sick">Sick Leave</option>
              <option value="personal">Personal Leave</option>
              <option value="maternity">Maternity Leave</option>
              <option value="paternity">Paternity Leave</option>
              <option value="unpaid">Unpaid Leave</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="leaveStartDate">Start Date *</label>
              <input type="date" id="leaveStartDate" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="leaveEndDate">End Date *</label>
              <input type="date" id="leaveEndDate" class="form-control" required>
            </div>
          </div>
          <div class="form-group">
            <label for="leaveReason">Reason</label>
            <textarea id="leaveReason" class="form-control" rows="3" placeholder="Optional reason for leave"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitLeaveBtn">Submit Request</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/leave.js"></script>
</body>
</html>
